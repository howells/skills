interface:
  display_name: "Mastraudit"
  short_description: "Audit a Mastra codebase against what actually breaks it, worst first"
  default_prompt: "Use $mastraudit to audit this: check execution semantics first - workflow step size, fan-out keying, retries, suspend and resume, load-bearing writes - then containment and structure, verifying every API shape against the installed packages rather than memory."
