interface:
  display_name: "Next"
  short_description: "Claim one issue, name the thread, deliver with Plimsoll"
  default_prompt: "Use $next to select this project's next actionable unstarted priority item and introduce the linked ticket in one short sentence explaining the outcome in everyday words. Immediately claim it as In Progress with verified session ownership, then rename the current thread for the item using supported harness controls before investigating delivery or delegating work. Skip other sessions' claims and preserve them on conflicts. Verify its delivery evidence. Include all child items and nested descendants regardless of priority, verify each one, and keep the parent incomplete while any required child remains unresolved. Work to their specs, record necessary clarifications, resolve documented prerequisites in the same task, and file unrelated findings as separate prioritized tracker items. Reconcile stale status or implement the remaining work with native parallel agents and a suitable mix of available models, preferring Sol, Terra and Luna where supported. Apply Plimsoll, verify the work, and push a reviewable PR. If auto-merge is configured, follow it through merge and required authorized delivery checks, then safely tidy this task's branches and worktree; otherwise leave the PR open and wait for review. Do not continue the queue. For a codebase health review, use $simplify instead."
