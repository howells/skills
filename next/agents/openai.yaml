interface:
  display_name: "Next"
  short_description: "Deliver one issue with parallel agents and Plimsoll"
  default_prompt: "Use $next to select this project's next actionable priority item, verify its live status and delivery evidence, and introduce the linked ticket in one short sentence explaining the outcome in everyday words. Reconcile stale status or implement the remaining work with native parallel agents and a suitable mix of available models, preferring Sol, Terra and Luna where supported. Apply Plimsoll, verify delivery, complete authorized release steps, and stop after that item."
