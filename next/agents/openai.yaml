interface:
  display_name: "Next"
  short_description: "Deliver one issue with parallel agents and Plimsoll"
  default_prompt: "Use $next to select this project's next actionable priority item, verify its live status and delivery evidence, and introduce the linked ticket in one short sentence explaining the outcome in everyday words. Work to its spec, record necessary clarifications, resolve documented prerequisites in the same task, and file unrelated findings as separate prioritized tracker items. Reconcile stale status or implement the remaining work with native parallel agents and a suitable mix of available models, preferring Sol, Terra and Luna where supported. Apply Plimsoll, verify the work, and push a reviewable PR. If auto-merge is configured, follow it through merge and required authorized delivery checks; otherwise leave the PR open and wait for review. Do not continue the queue."
